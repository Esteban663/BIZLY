<aside class="sidebar">
  <div class="logo-container">
    <img src="assets/LogoBizly.png" alt="BIZLY Logo" class="sidebar-logo" />
  </div>

  <nav class="sidebar-menu">
    <ul>
      <li routerLink="/dashboard" routerLinkActive="active">
        <span class="icon">📊</span> Dashboard
      </li>
      <li routerLink="/productos" routerLinkActive="active">
        <span class="icon">📦</span> Inventario
      </li>
      <li routerLink="/empleados" routerLinkActive="active">
        <span class="icon">👥</span> Empleados
      </li>
      <li routerLink="/reportes" routerLinkActive="active">
        <span class="icon">📈</span> Reportes
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-avatar">
        {{ (auth.currentUser()?.nombre || 'A')[0].toUpperCase() }}
      </div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name">{{ auth.currentUser()?.nombre || 'Admin' }}</span>
        <span class="sidebar-user-role">{{ auth.currentUser()?.rol || 'USER' }}</span>
      </div>
    </div>
    <button class="sidebar-logout" (click)="auth.logout()" title="Cerrar sesión">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</aside>
