<div class="auth-wrapper">
  <div class="auth-brand">
    <div class="auth-brand-logo">⚡ BIZLY</div>
    <p class="auth-brand-tagline">Crea tu cuenta y empieza a colaborar hoy.</p>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <h2>Crear cuenta</h2>
      <p class="auth-subtitle">Completa los datos para registrarte</p>

      <div *ngIf="errorMsg" class="alert-error">{{ errorMsg }}</div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" formControlName="nombre"
                 [class.invalid]="nombre.invalid && nombre.touched"
                 placeholder="Tu nombre" />
          <small *ngIf="nombre.invalid && nombre.touched">Nombre requerido (mín. 2 caracteres)</small>
        </div>

        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" formControlName="correo"
                 [class.invalid]="correo.invalid && correo.touched"
                 placeholder="usuario@correo.com" />
          <small *ngIf="correo.hasError('required') && correo.touched">El correo es obligatorio</small>
          <small *ngIf="correo.hasError('email') && correo.touched">Formato inválido</small>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" formControlName="contrasena"
                 [class.invalid]="contrasena.invalid && contrasena.touched"
                 placeholder="Mínimo 6 caracteres" />
          <small *ngIf="contrasena.hasError('minlength') && contrasena.touched">Mínimo 6 caracteres</small>
        </div>

        <div class="form-group">
          <label>Confirmar contraseña</label>
          <input type="password" formControlName="confirmar"
                 [class.invalid]="registerForm.hasError('mismatch') && confirmar.touched"
                 placeholder="Repite la contraseña" />
          <small *ngIf="registerForm.hasError('mismatch') && confirmar.touched">
            Las contraseñas no coinciden
          </small>
        </div>

        <button type="submit" class="btn-primary"
                [class.loading]="loading" [disabled]="loading">
          {{ loading ? '' : 'Registrarse' }}
        </button>

      </form>

      <hr class="auth-divider">
      <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
